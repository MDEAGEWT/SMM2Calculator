name: Build

# Runs only when started by hand: Actions tab > Build > Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build S2CN.vbproj -c Release

      # The program reads img, jump, step... from the exe's folder; Assets.zip holds them.
      - name: Unpack assets
        shell: pwsh
        run: |
          $out = 'bin/Release/net8.0-windows7.0'
          Expand-Archive "$out/Assets.zip" -DestinationPath $out -Force
          Remove-Item "$out/Assets.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SMM2Calculator
          path: bin/Release/net8.0-windows7.0/
